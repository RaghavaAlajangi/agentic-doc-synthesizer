version: '3.8'

services:
  # Backend FastAPI service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agi-backend
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - EXTERNAL_CHROMA_HOST=chroma-external
      - EXTERNAL_CHROMA_PORT=${EXTERNAL_CHROMA_PORT:-8000}
    depends_on:
      - chroma-external
    volumes:
      - ./backend:/app
    networks:
      - agi-network
    command: python -m uvicorn main:app --host 0.0.0.0 --port ${API_PORT:-8000}

  # Frontend React service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agi-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - agi-network

  # External Chroma DB - for external/sell-side research reports
  chroma-external:
    image: chromadb/chroma:latest
    container_name: chroma-external
    ports:
      - "8001:8000"
    environment:
      - ANONYMIZED_TELEMETRY=False
      - PERSIST_DIRECTORY=/data
    volumes:
      - chroma-external-data:/data
    networks:
      - agi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  chroma-external-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./chroma-data

networks:
  agi-network:
    driver: bridge
